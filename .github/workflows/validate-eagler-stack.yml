name: Validate modernized Eagler stack

on:
  pull_request:
  push:
    branches:
      - main
      - "modernize/**"

permissions:
  contents: read

jobs:
  validate-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned managed dependencies
        run: bash scripts/install-managed-dependencies.sh

      - name: Run stack smoke test
        run: bash scripts/stack-smoke-test.sh
