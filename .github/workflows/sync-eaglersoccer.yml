name: Sync EaglerSoccer JAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-eaglersoccer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out server repository
        uses: actions/checkout@v4

      - name: Download latest EaglerSoccer build
        run: |
          mkdir -p server/plugins
          curl -L --fail --show-error -sS \
            https://raw.githubusercontent.com/SMalone16/EaglerSoccer/main/dist/EaglerSoccer-1.0.0.jar \
            -o server/plugins/EaglerSoccer-1.0.0.jar

      - name: Commit JAR to server plugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/plugins/EaglerSoccer-1.0.0.jar
          if ! git diff --cached --quiet; then
            git commit -m "Add EaglerSoccer 1.0.0 plugin"
            git push
          fi
