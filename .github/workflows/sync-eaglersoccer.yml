name: Sync EaglerSoccer JAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-eaglersoccer.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EAGLER_SOCCER_SOURCE_COMMIT: a85d082144e41aa1053984abfa8a0c7f52cc822f
  EAGLER_SOCCER_JAR: EaglerSoccer-1.0.0.jar

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out server repository
        uses: actions/checkout@v4

      - name: Download pinned EaglerSoccer build
        run: |
          mkdir -p server/plugins
          curl -L --fail --show-error -sS             "https://raw.githubusercontent.com/SMalone16/EaglerSoccer/${EAGLER_SOCCER_SOURCE_COMMIT}/dist/${EAGLER_SOCCER_JAR}"             -o "server/plugins/${EAGLER_SOCCER_JAR}"
          unzip -tqq "server/plugins/${EAGLER_SOCCER_JAR}"

      - name: Commit JAR to server plugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "server/plugins/${EAGLER_SOCCER_JAR}"
          if ! git diff --cached --quiet; then
            git commit -m "Sync EaglerSoccer 1.0.0 plugin"
            git push
          fi
